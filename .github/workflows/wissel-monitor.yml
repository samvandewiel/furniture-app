name: Wissel monitor

# GitHub start geplande runs vaak uren te laat. Daarom draait één run ~5,5 uur en checkt
# die zelf elke 2 minuten; aan het eind start hij de volgende run. De cron is alleen een
# vangnet voor als die keten ooit breekt.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen testen: één check, geen meldingen sturen"
        type: boolean
        default: false

concurrency:
  # Testruns krijgen een eigen groep, zodat ze niet wachten op (of de opvolger verdringen
  # van) de doorlopende monitor.
  group: wissel-monitor-${{ github.ref }}-${{ inputs.dry_run && 'test' || 'live' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # om de volgende run te starten

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: wissel-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vorige staat herstellen
        uses: actions/cache/restore@v4
        with:
          path: wissel-monitor/state.json
          key: wissel-state-${{ github.run_id }}
          restore-keys: wissel-state-

      - name: Diagnose (tijdelijk)
        if: inputs.dry_run
        run: python diagnose.py

      - name: Wissel.nl checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_DISCOUNT: ${{ vars.MIN_DISCOUNT || '5' }}
          MIN_VALUE: ${{ vars.MIN_VALUE || '50' }}
          BRANDS: ${{ vars.BRANDS || 'coolblue,apple,mediamarkt,bol' }}
          CHECK_INTERVAL: ${{ vars.CHECK_INTERVAL || '120' }}
          RUN_MINUTES: ${{ inputs.dry_run && '0' || '330' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          PYTHONUNBUFFERED: "1"
        run: python monitor.py

      - name: Staat opslaan
        if: always() && !inputs.dry_run
        uses: actions/cache/save@v4
        with:
          path: wissel-monitor/state.json
          key: wissel-state-${{ github.run_id }}

      - name: Volgende run starten
        if: ${{ !cancelled() && !inputs.dry_run && github.ref == 'refs/heads/master' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run wissel-monitor.yml --repo "${{ github.repository }}" --ref master
